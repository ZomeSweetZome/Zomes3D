<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Geometry Extraction (ZOM-61)</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body { font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin: 20px; }
    pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>ZOM-61: GLB structure dump + geometry extraction</h1>
  <p>Phase 1 (structure dump) runs automatically; results in console as EXTRACT_* lines and below.</p>
  <pre id="out">loading…</pre>

  <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    const MODELS = [
      { key: 'pod',    path: '../src/models/zomes-pod2.glb',    nominalSqFt: 120 },
      { key: 'office', path: '../src/models/zomes-office2.glb', nominalSqFt: 170 },
      { key: 'studio', path: '../src/models/zomes-studio2.glb', nominalSqFt: 300 },
    ];

    const out = document.getElementById('out');
    const log = (s) => { out.textContent += s + '\n'; };
    out.textContent = '';

    function describe(model) {
      const meshes = [];
      const groups = [];
      model.traverse((o) => {
        if (o.isMesh) {
          const box = new THREE.Box3().setFromObject(o);
          meshes.push({
            name: o.name,
            parent: o.parent?.name ?? '',
            min: box.min.toArray().map((v) => +v.toFixed(3)),
            max: box.max.toArray().map((v) => +v.toFixed(3)),
            verts: o.geometry?.attributes?.position?.count ?? 0,
            morphs: o.morphTargetInfluences?.length ?? 0,
          });
        } else if (o.isGroup || o.isObject3D) {
          if (o.name) groups.push(o.name);
        }
      });
      return { meshes, groups };
    }

    async function run() {
      const loader = new THREE.GLTFLoader();
      const summary = {};
      for (const m of MODELS) {
        const gltf = await new Promise((res, rej) => loader.load(m.path, res, undefined, rej));
        const scene = gltf.scene;
        const box = new THREE.Box3().setFromObject(scene);
        const size = box.getSize(new THREE.Vector3());
        const d = describe(scene);
        // Rough footprint from overall XZ extent, assuming a regular polygon
        // close to a circle: area ≈ π·(d/2)² using the mean of X/Z extents.
        const diaM = (size.x + size.z) / 2;
        const areaM2 = Math.PI * (diaM / 2) ** 2;
        const areaSqFt = areaM2 * 10.7639;
        summary[m.key] = {
          bbox: { x: +size.x.toFixed(3), y: +size.y.toFixed(3), z: +size.z.toFixed(3) },
          approxDiaM: +diaM.toFixed(3),
          approxAreaSqFt: +areaSqFt.toFixed(1),
          nominalSqFt: m.nominalSqFt,
          areaRatio: +(areaSqFt / m.nominalSqFt).toFixed(3),
          meshCount: d.meshes.length,
          groupNames: [...new Set(d.groups)].slice(0, 60),
        };
        log(`=== ${m.key} ===`);
        log(JSON.stringify(summary[m.key], null, 1));
        // Window/door-relevant mesh names (letter-number pattern + doors)
        const interesting = d.meshes.filter((x) => /^[c-gC-G][_-]?\d+/.test(x.name) || /door|Door|glass|Glass|window|Window|found|Found|floor|Floor/.test(x.name));
        log(`interesting meshes (${interesting.length}):`);
        for (const im of interesting.slice(0, 80)) {
          log(`  ${im.name}  parent=${im.parent}  y=[${im.min[1]},${im.max[1]}]  morphs=${im.morphs}`);
        }
        console.log(`EXTRACT_SUMMARY_${m.key} ` + JSON.stringify(summary[m.key]));
        console.log(`EXTRACT_MESHES_${m.key} ` + JSON.stringify(d.meshes.map((x) => x.name)));
      }
      console.log('EXTRACT_DONE');
      log('DONE');
    }
    run().catch((e) => { log('ERROR: ' + e.message); console.log('EXTRACT_ERROR ' + e.message); });
  </script>
</body>
</html>
